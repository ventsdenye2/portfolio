server {
    listen 80;
    listen [::]:80;

    server_name portfolio.ventsdenye.com;

    root /home/ventsdenye/portfolio;
    index index.html;

    # The document root is a Git checkout; keep repository metadata private.
    location ~ /\.git(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits a hashed JS filename; media files are replaced only when a
    # new dist is deployed, so a short cache keeps updates predictable.
    location ~* \.(?:js|css|png|jpe?g|svg|webp|woff2?|glb)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
