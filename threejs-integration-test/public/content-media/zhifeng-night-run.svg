<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">知风夜跑</title>
  <desc id="desc">夜色校园道路与路灯构成的互动叙事项目封面</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#05090d"/><stop offset=".55" stop-color="#0d171c"/><stop offset="1" stop-color="#1b251e"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172025"/><stop offset="1" stop-color="#06090d"/></linearGradient>
    <radialGradient id="lamp"><stop stop-color="#fff3bd"/><stop offset=".22" stop-color="#d9c998" stop-opacity=".76"/><stop offset="1" stop-color="#d9c998" stop-opacity="0"/></radialGradient>
