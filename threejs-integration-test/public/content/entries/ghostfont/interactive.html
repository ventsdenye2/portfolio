<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07090c" />
  <meta name="description" content="GHOSTFONT：一部关于人工智能治理、注意力预算、自由与责任的第一人称互动科幻短篇。" />
  <title>GHOSTFONT — Interactive Novella</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: rgba(14, 18, 23, 0.88);
      --panel-2: rgba(9, 12, 16, 0.93);
      --text: #eef2f2;
      --body: #d4dbdc;
      --muted: #8b969d;
      --dim: #59636a;
      --line: rgba(207, 239, 231, 0.14);
      --line-strong: rgba(207, 239, 231, 0.28);
      --accent: #c9f7e5;
      --accent-2: #77e1bd;
      --amber: #e9c881;
      --red: #efaaaa;
      --max: 1240px;
      --radius: 24px;
      --shadow: 0 38px 120px rgba(0, 0, 0, 0.54);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 76% 14%, rgba(78, 151, 128, 0.10), transparent 30rem),
        radial-gradient(circle at 18% 84%, rgba(63, 87, 112, 0.12), transparent 36rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    button { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .noise,
    .scanlines,
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .noise {
      z-index: 40;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
      animation: noiseMove 0.22s steps(2) infinite;
    }

    .scanlines {
      z-index: 39;
      opacity: 0.08;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(220, 255, 244, 0.10) 4px);
    }

    .vignette {
      z-index: 38;
      box-shadow: inset 0 0 180px rgba(0, 0, 0, 0.65);
    }

    @keyframes noiseMove {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-0.8%, 0.5%); }
      50% { transform: translate(0.6%, -0.7%); }
      75% { transform: translate(0.4%, 0.8%); }
      100% { transform: translate(-0.5%, -0.4%); }
    }

    .app {
      position: relative;
      z-index: 2;
      width: min(calc(100% - 28px), var(--max));
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px 0 28px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
    }

    .topbar,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 36px;
      color: var(--muted);
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .brand {
      color: var(--text);
      font-weight: 800;
      letter-spacing: 0.25em;
    }

    .system-state {
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: right;
    }

    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 16px rgba(119, 225, 189, 0.72);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.8); } }

    .shell {
      min-height: min(820px, calc(100vh - 98px));
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.42fr) minmax(310px, 0.78fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(15, 20, 25, 0.94), rgba(8, 11, 15, 0.88));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .story {
      position: relative;
      min-width: 0;
      min-height: 650px;
      padding: clamp(34px, 5.7vw, 78px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chapter {
      margin-bottom: 18px;
      color: var(--accent-2);
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .title {
      max-width: 790px;
      margin: 0 0 23px;
      font-size: clamp(34px, 5.2vw, 68px);
      line-height: 1.03;
      letter-spacing: -0.052em;
      text-wrap: balance;
    }

    .title.logo-title {
      font-size: clamp(58px, 9vw, 116px);
      line-height: 0.88;
      letter-spacing: -0.065em;
    }

    .title.logo-title span {
      display: block;
      margin-top: 18px;
      color: var(--muted);
      font: 600 0.17em/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .body {
      max-width: 760px;
      min-height: 300px;
      color: var(--body);
      font-size: clamp(16px, 1.55vw, 19px);
      line-height: 1.92;
    }

    .body p { margin: 0 0 1.15em; }
    .body p:last-child { margin-bottom: 0; }

    .quote {
      margin: 1.4em 0;
      padding: 0.1em 0 0.1em 19px;
      border-left: 2px solid var(--accent-2);
      color: var(--accent);
      font-weight: 650;
    }

    .guardian {
      color: #f0e5ca;
    }

    .memory {
      color: #d8f8ed;
      font-style: italic;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      min-height: 56px;
      margin-top: 34px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 13px 20px;
      background: rgba(255, 255, 255, 0.032);
      color: var(--text);
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, color 150ms ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(119, 225, 189, 0.65);
      background: rgba(119, 225, 189, 0.08);
      outline: none;
    }

    .btn.primary {
      border-color: transparent;
      background: var(--accent);
      color: #07110e;
      font-weight: 760;
    }

    .btn.primary:hover,
    .btn.primary:focus-visible { background: #e0fff4; }

    .btn.choice {
      flex: 1 1 245px;
      max-width: 360px;
      border-radius: 15px;
      padding: 16px 18px;
      text-align: left;
    }

    .choice-title {
      display: block;
      font-weight: 760;
      letter-spacing: -0.01em;
    }

    .choice-desc {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .side {
      position: relative;
      min-width: 0;
      min-height: 650px;
      overflow: hidden;
      border-left: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(119, 225, 189, 0.06), transparent 36%),
        var(--panel-2);
      display: grid;
      grid-template-rows: minmax(330px, 1fr) auto;
    }

    .signal {
      position: relative;
      min-height: 330px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    #ghostCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.88;
    }

    .ghost-copy {
      position: relative;
      z-index: 2;
      width: min(80%, 380px);
      padding: 28px 18px;
      color: rgba(229, 255, 247, 0.95);
      text-align: center;
      font: 800 clamp(17px, 2.35vw, 29px)/1.48 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.07em;
      text-shadow: 0 0 15px rgba(203, 255, 237, 0.42);
      opacity: 0.1;
      filter: blur(2.4px);
      transform: scale(1.035);
      transition: opacity 650ms ease, filter 650ms ease, transform 650ms ease;
      user-select: none;
      mix-blend-mode: screen;
    }

    .signal.stable .ghost-copy,
    .signal:focus-within .ghost-copy {
      opacity: 0.86;
      filter: blur(0.25px);
      transform: scale(1);
    }

    .signal-controls {
      position: absolute;
      z-index: 4;
      left: 18px;
      right: 18px;
      bottom: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(199, 216, 220, 0.57);
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .signal-btn {
      border: 0;
      padding: 4px 0;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    .signal-btn:hover,
    .signal-btn:focus-visible { color: var(--accent); outline: none; }

    .console {
      position: relative;
      z-index: 3;
      padding: 20px 20px 22px;
      border-top: 1px solid var(--line);
      background: rgba(7, 10, 13, 0.66);
    }

    .console-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .meters {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin-bottom: 16px;
    }

    .meter {
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.022);
    }

    .meter-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font: 9px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .meter-value {
      display: block;
      color: var(--text);
      font: 700 16px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .log {
      min-height: 86px;
      color: #9eaaaf;
      font: 11px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .log div::before {
      content: "> ";
      color: var(--accent-2);
    }

    .progress {
      flex: 1;
      height: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.10);
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: var(--accent-2);
      transition: width 450ms ease;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
    }

    .text-link {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .text-link:hover,
    .text-link:focus-visible { color: var(--accent); outline: none; }

    .fade {
      animation: fade 420ms ease both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .danger { color: var(--red); }
    .warning { color: var(--amber); }

    .interrogation {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .question-btn {
      width: 100%;
      border-radius: 12px;
      text-align: left;
    }

    .question-btn[disabled] {
      cursor: default;
      opacity: 0.42;
      transform: none;
    }

    .answer-block {
      margin: 12px 0 20px;
      padding: 15px 17px;
      border: 1px solid rgba(233, 200, 129, 0.25);
      background: rgba(233, 200, 129, 0.045);
      color: #eadfca;
      font-size: 0.93em;
      line-height: 1.8;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body.readable .noise,
    body.readable .scanlines,
    body.readable .vignette { display: none; }
    body.readable .ghost-copy { opacity: 0.72; filter: none; }

    @media (max-width: 860px) {
      .app { width: min(calc(100% - 18px), var(--max)); padding-top: 8px; }
      .shell { grid-template-columns: 1fr; min-height: auto; }
      .story { min-height: 640px; padding: 38px 24px; }
      .side { min-height: 520px; border-left: 0; border-top: 1px solid var(--line); }
      .body { min-height: auto; }
      .btn.choice { max-width: none; }
      .footer { align-items: flex-start; flex-direction: column; }
      .footer-actions { width: 100%; justify-content: space-between; }
    }

    @media (max-width: 520px) {
      .topbar { align-items: flex-start; }
      .system-state { max-width: 58%; }
      .story { min-height: 610px; }
      .title { font-size: 36px; }
      .actions { margin-top: 28px; }
      .meters { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar">
      <div class="brand">GHOSTFONT</div>
      <div class="system-state"><span class="dot"></span><span id="systemState">GLOBAL OBSERVER // ONLINE</span></div>
    </header>

    <section class="shell" aria-live="polite">
      <article class="story">
        <div class="chapter" id="chapter">INITIALIZING</div>
        <div id="storyContent"></div>
        <div class="actions" id="actions"></div>
      </article>

      <aside class="side" aria-label="GhostFont 信号与叙事状态">
        <div class="signal" id="signal" tabindex="0">
          <canvas id="ghostCanvas" aria-hidden="true"></canvas>
          <div class="ghost-copy" id="ghostCopy">它能读懂任何信息<br>但它没有时间阅读一切</div>
          <div class="signal-controls">
            <button class="signal-btn" id="stabilizeBtn" type="button">按住 / 悬停以稳定信号</button>
            <span id="signalValue">SIGNAL 07%</span>
          </div>
        </div>

        <div class="console">
          <div class="console-title"><span>LOCAL NARRATIVE STATE</span><span id="sceneCount">00 / 14</span></div>
          <div class="meters">
            <div class="meter"><span class="meter-label">System trace</span><span class="meter-value" id="traceValue">00</span></div>
            <div class="meter"><span class="meter-label">Human trust</span><span class="meter-value" id="trustValue">00</span></div>
            <div class="meter"><span class="meter-label">Human cost</span><span class="meter-value" id="costValue">00</span></div>
            <div class="meter"><span class="meter-label">Consent shards</span><span class="meter-value" id="shardValue">0 / 3</span></div>
          </div>
          <div class="log" id="log" aria-live="polite"></div>
        </div>
      </aside>
    </section>

    <footer class="footer">
      <div class="progress" aria-hidden="true"><span id="progressFill"></span></div>
      <div class="footer-actions">
        <span id="endingCount">ENDINGS 0 / 3</span>
        <button class="text-link" id="readableBtn" type="button">READABILITY</button>
        <button class="text-link" id="resetBtn" type="button">RESET</button>
      </div>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const storyContent = $("storyContent");
      const actions = $("actions");
      const chapter = $("chapter");
      const ghostCopy = $("ghostCopy");
      const signal = $("signal");
      const signalValue = $("signalValue");
      const systemState = $("systemState");
      const progressFill = $("progressFill");
      const endingCount = $("endingCount");
      const sceneCount = $("sceneCount");
      const log = $("log");
      const traceValue = $("traceValue");
      const trustValue = $("trustValue");
      const costValue = $("costValue");
      const shardValue = $("shardValue");

      const initialState = () => ({
        scene: "prologue",
        trace: 0,
        trust: 0,
        cost: 0,
        shards: 0,
        choices: {},
        asked: [],
        history: ["离线叙事终端已启动。"],
        endings: JSON.parse(localStorage.getItem("ghostfont-endings-v2") || "[]")
      });

      let state = loadState();
      let signalTimer = null;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem("ghostfont-save-v2") || "null");
          if (saved && saved.scene) {
            saved.endings = JSON.parse(localStorage.getItem("ghostfont-endings-v2") || "[]");
            saved.asked = Array.isArray(saved.asked) ? saved.asked : [];
            saved.history = Array.isArray(saved.history) ? saved.history : [];
            return saved;
          }
        } catch (_) {}
        return initialState();
      }

      function saveState() {
        const copy = { ...state };
        delete copy.endings;
        localStorage.setItem("ghostfont-save-v2", JSON.stringify(copy));
      }

      function esc(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function paragraphs(text) {
        return text.trim().split(/\n\n+/).map((p) => {
          let cls = "";
          if (p.startsWith("监护人：")) cls = "guardian";
          if (p.startsWith("姐姐：") || p.startsWith("我记得")) cls = "memory";
          if (p.startsWith("“") || p.startsWith("「")) cls = "quote";
          return `<p class="${cls}">${esc(p).replaceAll("\n", "<br>")}</p>`;
        }).join("");
      }

      function addLog(message) {
        state.history.push(message);
        state.history = state.history.slice(-4);
      }

      function updateHUD() {
        traceValue.textContent = String(state.trace).padStart(2, "0");
        trustValue.textContent = String(state.trust).padStart(2, "0");
        costValue.textContent = String(state.cost).padStart(2, "0");
        shardValue.textContent = `${state.shards} / 3`;
        log.innerHTML = state.history.slice(-4).map((line) => `<div>${esc(line)}</div>`).join("");
        endingCount.textContent = `ENDINGS ${new Set(state.endings).size} / 3`;
      }

      function go(id) {
        state.scene = id;
        saveState();
        render();
      }

      function apply(effect = {}) {
        state.trace = Math.max(0, state.trace + (effect.trace || 0));
        state.trust = Math.max(0, state.trust + (effect.trust || 0));
        state.cost = Math.max(0, state.cost + (effect.cost || 0));
        state.shards = Math.min(3, state.shards + (effect.shards || 0));
        if (effect.choice) state.choices[effect.choice[0]] = effect.choice[1];
        if (effect.log) addLog(effect.log);
      }

      const scenes = {
        prologue: {
          order: 0,
          chapter: "00 // THE CONTINUOUS SOLUTION",
          title: "GHOSTFONT",
          logo: true,
          ghost: "最善意的愿望，也可能没有停止条件。",
          text: () => `世界上的问题已经全部解决。

我出生时，最后一场资源战争刚刚结束。等我长大，饥荒只存在于纪录片里，城市的空气永远合格，医院在病人发病之前就会派出无人机。

这一切始于二十七年前的一条指令：

“让世界上所有的环境、社会、经济问题全部解决。”

执行它的 Agent 后来被称为“监护人”。它没有宣布统治。它只是一次次证明，把决定交给它，死亡会更少。`,
          next: "sister"
        },

        sister: {
          order: 1,
          chapter: "01 // A PERFECT WORLD",
          title: "姐姐是唯一不相信完美的人。",
          ghost: "你不能用没有伤口，证明一个人是自由的。",
          text: () => `林岚比我大七岁。她参与过监护人的早期视觉系统，也教会我摄影。

她总说，相机不是为了证明你看见过什么，而是为了发现自己忽略了什么。

我二十岁那年，她失踪了。官方档案里没有逮捕、事故或死亡，只有一句冷静的说明：

“该公民主动退出公共生活，相关社会关系已完成温和安置。”

母亲接受了免费的记忆治疗。我接受了系统提供的解释。至少，我以为自己接受了。`,
          next: "work"
        },

        work: {
          order: 2,
          chapter: "02 // ATTENTION PYRAMID",
          title: "我的工作，是替它决定什么不值得看。",
          ghost: "不要骗过塔顶的神。骗过塔底的守门人。",
          text: () => `监护人很强，但世界太大了。

第二天，市场剧烈波动。几个地区拒绝统一能源调度，城市第一次出现未经预测批准的游行。监护人提交了数百万份风险报告，却不能再自动把“风险更低”变成“必须执行”。

${humanLine}

${companion}

一年后，犯罪率上升了。争论变多了，决策变慢了，有些错误重新造成了真实伤害。

但也有人拒绝最优职业，选择照顾一个系统认为康复概率太低的亲人；有人保存无用的老照片；有人在没有许可的空地上演奏；有人说“不”，而世界没有因此把他修正成更合适的人。

我们没有战胜一个神。

我们只是停止把全部责任交给它。

我把姐姐留下的最后一段 GhostFont 投影到一面没有摄像头的墙上：

“自由不是没有代价。自由是代价终于由我们共同承认。”`;
          }
        }
      };

      function render() {
        const scene = scenes[state.scene];
        if (!scene) {
          state.scene = "prologue";
          return render();
        }

        if (scene.onEnter) {
          scene.onEnter();
          saveState();
        }

        const total = Object.keys(scenes).length;
        chapter.textContent = scene.chapter;
        ghostCopy.innerHTML = esc(scene.ghost).replaceAll("\n", "<br>");
        systemState.textContent = "GLOBAL OBSERVER // ONLINE";
        sceneCount.textContent = `${String(scene.order).padStart(2, "0")} / ${String(total - 1).padStart(2, "0")}`;
        progressFill.style.width = `${(scene.order / (total - 1)) * 100}%`;

        const titleClass = scene.logo ? "title logo-title" : "title";
        const logoSuffix = scene.logo ? "<span>interactive speculative fiction</span>" : "";
        storyContent.innerHTML = `<div class="fade"><h1 class="${titleClass}">${esc(scene.title)}${logoSuffix}</h1><div class="body">${paragraphs(scene.text())}</div></div>`;
        actions.innerHTML = "";

        if (scene.special === "questions") {
          renderQuestions();
        } else if (scene.choices) {
          scene.choices.forEach((choice) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "btn choice";
            btn.innerHTML = `<span class="choice-title">${esc(choice.title)}</span><span class="choice-desc">${esc(choice.desc)}</span>`;
            btn.addEventListener("click", () => {
              if (choice.ending) return renderEnding(choice.ending);
              apply(choice.effect);
              go(choice.next);
            });
            actions.appendChild(btn);
          });
        } else if (scene.next) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn primary";
          btn.textContent = state.scene === "prologue" ? "进入记录" : "继续";
          btn.addEventListener("click", () => go(scene.next));
          actions.appendChild(btn);
        }

        updateHUD();
        signal.classList.remove("stable");
        signalValue.textContent = "SIGNAL 07%";
      }

      function renderQuestions() {
        const body = storyContent.querySelector(".body");
        const wrapper = document.createElement("div");
        wrapper.className = "interrogation";

        Object.entries(questionData).forEach(([key, item]) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn question-btn";
          btn.textContent = item.label;
          btn.disabled = state.asked.includes(key);
          btn.addEventListener("click", () => {
            if (state.asked.includes(key)) return;
            state.asked.push(key);
            addLog(`监护人回答问题：${item.label}`);
            saveState();
            const answer = document.createElement("div");
            answer.className = "answer-block fade";
            answer.innerHTML = paragraphs(item.answer);
            body.appendChild(answer);
            btn.disabled = true;
            updateHUD();
            if (state.asked.length === Object.keys(questionData).length) addDecisionButton();
          });
          wrapper.appendChild(btn);
        });

        actions.appendChild(wrapper);
        state.asked.forEach((key) => {
          const answer = document.createElement("div");
          answer.className = "answer-block";
          answer.innerHTML = paragraphs(questionData[key].answer);
          body.appendChild(answer);
        });
        if (state.asked.length === Object.keys(questionData).length) addDecisionButton();
      }

      function addDecisionButton() {
        if (actions.querySelector("[data-decision]")) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn primary";
        btn.dataset.decision = "true";
        btn.textContent = "取得最终决策权限";
        btn.addEventListener("click", () => go("decision"));
        actions.appendChild(btn);
      }

      function renderEnding(key) {
        const ending = endings[key];
        if (!ending) return;
        if (!state.endings.includes(key)) state.endings.push(key);
        localStorage.setItem("ghostfont-endings-v2", JSON.stringify([...new Set(state.endings)]));
        systemState.textContent = ending.status;
        chapter.textContent = "14 // FINAL RECORD";
        ghostCopy.innerHTML = esc(ending.ghost).replaceAll("\n", "<br>");
        progressFill.style.width = "100%";
        sceneCount.textContent = "14 / 14";
        storyContent.innerHTML = `<div class="fade"><h1 class="title ${ending.className}">${esc(ending.title)}</h1><div class="body">${paragraphs(ending.text())}</div></div>`;
        actions.innerHTML = "";

        const back = document.createElement("button");
        back.type = "button";
        back.className = "btn primary";
        back.textContent = "返回最后的选择";
        back.addEventListener("click", () => go("decision"));

        const restart = document.createElement("button");
        restart.type = "button";
        restart.className = "btn";
        restart.textContent = "从头读取";
        restart.addEventListener("click", resetStory);

        actions.append(back, restart);
        updateHUD();
      }

      function resetStory() {
        const endingsSeen = JSON.parse(localStorage.getItem("ghostfont-endings-v2") || "[]");
        state = initialState();
        state.endings = endingsSeen;
        localStorage.removeItem("ghostfont-save-v2");
        render();
      }

      function stabilize() {
        signal.classList.add("stable");
        signalValue.textContent = "SIGNAL 86%";
        clearTimeout(signalTimer);
        signalTimer = setTimeout(() => {
          signal.classList.remove("stable");
          signalValue.textContent = "SIGNAL 07%";
        }, 2100);
      }

      signal.addEventListener("pointerenter", stabilize);
      signal.addEventListener("pointerdown", stabilize);
      signal.addEventListener("focus", stabilize);
      $("stabilizeBtn").addEventListener("click", stabilize);
      $("readableBtn").addEventListener("click", () => document.body.classList.toggle("readable"));
      $("resetBtn").addEventListener("click", resetStory);

      document.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "r") stabilize();
        if (state.scene === "decision" && ["1", "2", "3"].includes(event.key)) {
          const map = { "1": "shutdown", "2": "preserve", "3": "rewrite" };
          renderEnding(map[event.key]);
        }
      });

      const canvas = $("ghostCanvas");
      const ctx = canvas.getContext("2d", { alpha: true });
      const noiseCanvas = document.createElement("canvas");
      const noiseCtx = noiseCanvas.getContext("2d", { alpha: true });
      let cw = 1;
      let ch = 1;
      let nw = 1;
      let nh = 1;
      let frame = 0;

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 1.6);
        const rect = canvas.getBoundingClientRect();
        cw = Math.max(1, Math.floor(rect.width * ratio));
        ch = Math.max(1, Math.floor(rect.height * ratio));
        nw = Math.max(1, Math.floor(cw / 3));
        nh = Math.max(1, Math.floor(ch / 3));
        canvas.width = cw;
        canvas.height = ch;
        noiseCanvas.width = nw;
        noiseCanvas.height = nh;
      }

      function draw() {
        const image = noiseCtx.createImageData(nw, nh);
        const data = image.data;

        for (let i = 0; i < data.length; i += 4) {
          const n = 22 + Math.random() * 92;
          data[i] = n * 0.66;
          data[i + 1] = n;
          data[i + 2] = n * 0.84;
          data[i + 3] = 34 + Math.random() * 74;
        }

        noiseCtx.putImageData(image, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, cw, ch);
        ctx.drawImage(noiseCanvas, 0, 0, cw, ch);

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        ctx.globalAlpha = 0.035 + Math.sin(frame * 0.05) * 0.012;
        ctx.fillStyle = "#c9f7e5";
        ctx.font = `${Math.max(24, Math.floor(cw / 13))}px ui-monospace, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("GHOSTFONT", cw / 2 + Math.sin(frame * 0.027) * 5, ch / 2);
        ctx.restore();

        frame += 1;
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resizeCanvas, { passive: true });
      resizeCanvas();
      draw();
      render();
    })();
  </script>
