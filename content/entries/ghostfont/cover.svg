<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GHOSTFONT / 幽灵字体</title>
  <desc id="desc">黑色信号噪点中的幽灵字体项目封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#05070b"/><stop offset=".55" stop-color="#10151d"/><stop offset="1" stop-color="#251b18"/></linearGradient>
    <radialGradient id="glow" cx="75%" cy="42%" r="65%"><stop stop-color="#eb9b50" stop-opacity=".55"/><stop offset=".45" stop-color="#534b96" stop-opacity=".22"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 1h8" stroke="#e7ebfb" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g opacity=".5" stroke="#a9b5d8" stroke-width="1"><path d="M0 170h1600M0 490h1600M0 810h1600"/><path d="M220 0v1000M620 0v1000M1020 0v1000M1420 0v1000"/></g>
  <g fill="#8ea6ff" opacity=".75"><circle cx="180" cy="206" r="3"/><circle cx="422" cy="677" r="2"/><circle cx="1058" cy="221" r="3"/><circle cx="1370" cy="690" r="2"/></g>
  <g filter="url(#blur)" opacity=".6"><ellipse cx="1250" cy="400" rx="160" ry="110" fill="#f09a4e"/><ellipse cx="520" cy="720" rx="200" ry="80" fill="#5267d5"/></g>
  <rect width="1600" height="1000" fill="url(#scan)"/>
  <text x="96" y="116" fill="#f6efe0" font-family="Arial, sans-serif" font-size="26" letter-spacing="8">CONCEPT / 2026</text>
  <text x="92" y="565" fill="#f8f1e4" font-family="Arial Black, Arial, sans-serif" font-size="172" font-weight="900" letter-spacing="-8">GHOST</text>
  <text x="92" y="718" fill="#9caaff" font-family="Arial Black, Arial, sans-serif" font-size="172" font-weight="900" letter-spacing="-8">FONT</text>
  <text x="100" y="786" fill="#f0a653" font-family="Arial, sans-serif" font-size="30" letter-spacing="12">幽 灵 字 体</text>
  <text x="96" y="914" fill="#c2c9d8" font-family="Arial, sans-serif" font-size="22" letter-spacing="2">THE SYSTEM CAN READ EVERYTHING. IT CANNOT ATTEND TO EVERYTHING.</text>
</svg>
